<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SBC ERP Whitepaper Library</title>
  <meta name="description" content="Two-document entry for the SBC ERP whitepaper and ERPNext accounting engine rules.">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <style>
    :root {
      --bg: #f4f6f7;
      --panel: #ffffff;
      --text: #17242b;
      --muted: #61707a;
      --line: #d8e0e4;
      --accent: #8f582b;
      --accent-text: #fff8f1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font: 400 16px/1.5 system-ui, -apple-system, sans-serif;
    }

    .library {
      width: min(760px, 100%);
      margin: 0 auto;
    }

    .viewer-shell {
      width: min(1420px, calc(100vw - 32px));
      margin: 0 auto;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 18px 44px rgba(17, 30, 38, 0.06);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1;
      white-space: nowrap;
    }

    p {
      margin: 10px 0 0;
      color: var(--muted);
    }

    .links {
      display: grid;
      gap: 12px;
      margin-top: 22px;
    }

    .link {
      display: block;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: inherit;
      text-decoration: none;
    }

    .link:hover {
      border-color: var(--accent);
    }

    .link strong {
      display: block;
      font-size: 1rem;
    }

    .link span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .viewer-shell {
      display: none;
    }

    .viewer-shell.is-open {
      display: block;
    }

    .viewer-shell .card {
      padding: 36px 40px 42px;
      border-radius: 24px;
    }

    .viewer-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 26px;
    }

    .viewer-title {
      margin: 0;
      font-size: 1.35rem;
      line-height: 1.15;
    }

    .viewer-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .viewer-actions a,
    .viewer-actions button {
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--text);
      text-decoration: none;
      font: inherit;
      cursor: pointer;
    }

    .viewer-actions button {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .viewer-state {
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fafcfc;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .viewer-state[hidden],
    .markdown-body[hidden] {
      display: none;
    }

    .markdown-body {
      max-width: 1240px;
      margin: 0 auto;
      font-size: 17px;
      line-height: 1.7;
      color: var(--text);
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4 {
      line-height: 1.2;
      color: #0f1e25;
    }

    .markdown-body h1 {
      white-space: normal;
      margin: 0 0 20px;
      font-size: clamp(2.4rem, 4vw, 3.5rem);
      letter-spacing: -0.03em;
    }

    .markdown-body h2 {
      margin: 42px 0 16px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: clamp(1.6rem, 2.4vw, 2.2rem);
    }

    .markdown-body h3 {
      margin: 30px 0 12px;
      font-size: 1.3rem;
    }

    .markdown-body p,
    .markdown-body li,
    .markdown-body blockquote {
      color: #21343d;
    }

    .markdown-body ul,
    .markdown-body ol {
      padding-left: 1.4rem;
      margin: 0 0 18px;
    }

    .markdown-body li {
      margin-bottom: 6px;
    }

    .markdown-body a {
      color: var(--accent);
      text-underline-offset: 3px;
    }

    .markdown-body blockquote {
      margin: 24px 0;
      padding: 16px 18px;
      border-left: 4px solid var(--accent);
      border-radius: 0 12px 12px 0;
      background: #fbf7f2;
    }

    .markdown-body hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 34px 0;
    }

    .markdown-body code {
      padding: 0.16em 0.36em;
      border-radius: 6px;
      background: #eef3f5;
      overflow-wrap: anywhere;
    }

    .markdown-body pre {
      overflow-x: auto;
      padding: 18px 20px;
      border-radius: 16px;
      background: #13212a;
      color: #eef4f7;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    .markdown-body pre code {
      padding: 0;
      background: transparent;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      display: block;
      overflow-x: auto;
      margin: 22px 0;
      border-radius: 14px;
    }

    .markdown-body th,
    .markdown-body td {
      padding: 12px 14px;
      border: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .markdown-body th {
      background: #f5f8f9;
    }

    .markdown-body img {
      max-width: 100%;
      border-radius: 14px;
    }

    .markdown-body .mermaid {
      overflow-x: auto;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fbfcfc;
    }

    .markdown-body .mermaid svg {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
    }

    @media (max-width: 760px) {
      h1 {
        white-space: normal;
      }

      .card,
      .viewer-shell .card {
        padding: 22px;
      }

      .viewer-topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .viewer-shell {
        width: 100%;
      }

      .markdown-body {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <main class="library card" id="library">
    <h1>SBC ERP Whitepaper Library</h1>
    <p>Two documents.</p>
    <div class="links">
      <a class="link" href="?doc=SBC-ERP-OIL-GAS-STANDARDS-AND-CONTROLS-WHITEPAPER.md" data-md-doc="SBC-ERP-OIL-GAS-STANDARDS-AND-CONTROLS-WHITEPAPER.md">
        <strong>Main Whitepaper</strong>
        <span>Standards, architecture, governance, and controls</span>
      </a>
      <a class="link" href="?doc=ERPNext-Accounting-Engine-Rules.md" data-md-doc="ERPNext-Accounting-Engine-Rules.md">
        <strong>ERPNext Accounting Engine Rules</strong>
        <span>Accounting engine baseline</span>
      </a>
    </div>
  </main>

  <section class="viewer-shell" id="markdown-viewer">
    <div class="card">
      <div class="viewer-topbar">
        <h2 class="viewer-title" id="viewer-document-title">Document preview</h2>
        <div class="viewer-actions">
          <a id="viewer-source-link" href="#" target="_blank" rel="noopener noreferrer">Open source</a>
          <button id="viewer-close" type="button">Back</button>
        </div>
      </div>
      <div class="viewer-state" id="viewer-state">Loading document...</div>
      <article class="markdown-body" id="markdown-body" hidden></article>
    </div>
  </section>

  <script>
    (() => {
      const documents = {
        'SBC-ERP-OIL-GAS-STANDARDS-AND-CONTROLS-WHITEPAPER.md': {
          title: 'SBC ERP Standards and Controls Whitepaper'
        },
        'ERPNext-Accounting-Engine-Rules.md': {
          title: 'ERPNext Accounting Engine Rules'
        }
      };

      const library = document.getElementById('library');
      const viewerShell = document.getElementById('markdown-viewer');
      const viewerState = document.getElementById('viewer-state');
      const viewerBody = document.getElementById('markdown-body');
      const viewerTitle = document.getElementById('viewer-document-title');
      const viewerSourceLink = document.getElementById('viewer-source-link');
      const viewerClose = document.getElementById('viewer-close');

      mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'strict',
        theme: 'base'
      });

      marked.setOptions({
        gfm: true,
        breaks: false,
        headerIds: true,
        mangle: false
      });

      function normalizeDocName(docName) {
        if (!docName) {
          return null;
        }

        const trimmed = docName.trim();
        return Object.prototype.hasOwnProperty.call(documents, trimmed) ? trimmed : null;
      }

      function setLibraryMode() {
        library.hidden = false;
        viewerShell.classList.remove('is-open');
        viewerBody.hidden = true;
        viewerBody.innerHTML = '';
        viewerState.hidden = true;
        document.title = 'SBC ERP Whitepaper Library';
      }

      function setViewerMode(title, sourceHref) {
        library.hidden = true;
        viewerShell.classList.add('is-open');
        viewerTitle.textContent = title;
        viewerSourceLink.href = sourceHref;
        document.title = `${title} | SBC ERP Whitepaper Library`;
      }

      function setViewerState(message, isError) {
        viewerState.hidden = false;
        viewerState.textContent = message;
        viewerState.style.color = isError ? '#8a2f2f' : '';
        viewerBody.hidden = true;
      }

      function showRenderedMarkdown(html) {
        viewerState.hidden = true;
        viewerState.style.color = '';
        viewerBody.innerHTML = html;
        viewerBody.hidden = false;
      }

      function convertMermaidCodeBlocks(renderedHtml) {
        const template = document.createElement('template');
        template.innerHTML = renderedHtml;

        template.content.querySelectorAll('pre > code.language-mermaid').forEach((codeElement) => {
          const preElement = codeElement.parentElement;
          const mermaidElement = document.createElement('div');
          mermaidElement.className = 'mermaid';
          mermaidElement.textContent = codeElement.textContent || '';
          preElement.replaceWith(mermaidElement);
        });

        return template.innerHTML;
      }

      async function renderMermaidCharts() {
        const mermaidNodes = viewerBody.querySelectorAll('.mermaid');
        if (!mermaidNodes.length) {
          return;
        }

        await mermaid.run({ nodes: mermaidNodes });
      }

      async function openMarkdownDocument(docName, pushState = true) {
        const normalizedDoc = normalizeDocName(docName);
        if (!normalizedDoc) {
          setLibraryMode();
          return;
        }

        const metadata = documents[normalizedDoc];
        setViewerMode(metadata.title, normalizedDoc);
        setViewerState('Loading document...', false);

        try {
          const response = await fetch(normalizedDoc, { cache: 'no-store' });
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const markdown = await response.text();
          const rendered = marked.parse(markdown);
          const mermaidReady = convertMermaidCodeBlocks(rendered);
          const sanitized = DOMPurify.sanitize(mermaidReady, {
            USE_PROFILES: { html: true }
          });

          showRenderedMarkdown(sanitized);
          await renderMermaidCharts();

          const url = new URL(window.location.href);
          url.searchParams.set('doc', normalizedDoc);
          if (pushState) {
            window.history.pushState({ doc: normalizedDoc }, '', url);
          }
        } catch (error) {
          setViewerState('The document could not be loaded.', true);
        }
      }

      document.querySelectorAll('[data-md-doc]').forEach((link) => {
        link.addEventListener('click', (event) => {
          event.preventDefault();
          openMarkdownDocument(link.getAttribute('data-md-doc'));
        });
      });

      viewerClose.addEventListener('click', () => {
        const url = new URL(window.location.href);
        url.searchParams.delete('doc');
        window.history.pushState({}, '', url);
        setLibraryMode();
      });

      window.addEventListener('popstate', () => {
        const docName = normalizeDocName(new URLSearchParams(window.location.search).get('doc'));
        if (docName) {
          openMarkdownDocument(docName, false);
        } else {
          setLibraryMode();
        }
      });

      const initialDoc = normalizeDocName(new URLSearchParams(window.location.search).get('doc'));
      if (initialDoc) {
        openMarkdownDocument(initialDoc, false);
      } else {
        setLibraryMode();
      }
    })();
  </script>
</body>
</html>
